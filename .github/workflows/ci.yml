name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

  android:
    name: Android (detekt, JVM unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The build targets JVM 17 (see build-logic and app/build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The JVM tests load the host build of the Rust core (:core:native cargoHost, release-ffi
      # profile) through JNA, so cargo must be on the PATH.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # The runner image ships the Android SDK (ANDROID_HOME); the app has the `oss`/`full`
      # flavors, so the unit-test task is testOssDebugUnitTest (`:app:testDebugUnitTest` does not exist).
      - name: Detekt
        run: ./gradlew detekt

      - name: JVM unit tests
        run: ./gradlew :app:testOssDebugUnitTest
