[package]
name = "zl-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
zl-config = { path = "../zl-config" }
zl-core = { path = "../zl-core" }
zl-db = { path = "../zl-db" }
zl-library = { path = "../zl-library" }
zl-media = { path = "../zl-media" }
zl-platforms = { path = "../zl-platforms" }
zl-theme = { path = "../zl-theme" }
thiserror = { workspace = true }
uniffi = { workspace = true }

[features]
# The binding generator (cargo run --features bindgen --bin uniffi-bindgen): not part of the library.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
