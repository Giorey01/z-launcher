[package]
name = "zl-archive"
description = "Extraction of zip, 7z and RAR archives with checked paths, for the app and the Pods"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
zip = { workspace = true, features = ["aes-crypto"] }
sevenz-rust2 = { version = "0.25", features = ["aes256"] }
# RAR 1.3 to RAR 7 in pure Rust (no C++ UnRAR): readers only, with encrypted archives and
# parallel decoding.
rars = { version = "0.13", default-features = false, features = ["encryption", "parallel"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Writes the encrypted 7z of the password tests.
sevenz-rust2 = { version = "0.25", features = ["compress", "aes256"] }
sha2 = "0.10"
hex = "0.4"

[lints]
workspace = true
