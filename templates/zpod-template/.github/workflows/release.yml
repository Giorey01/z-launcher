name: Build, Sign, and Release Pod

on:
  push:
    tags:
      - 'v*'

jobs:
  release-pod:
    name: Package .zlpod and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cryptography package
        run: pip install cryptography

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint and Detekt
        run: ./gradlew detekt

      - name: Build DEX and staging tree
        run: ./gradlew stagePod

      - name: Package and Sign .zlpod
        env:
          POD_SIGNING_KEY: ${{ secrets.POD_SIGNING_KEY }}
        run: |
          echo "$POD_SIGNING_KEY" > signing.key
          python3 ../z-launcher/scripts/package_pod.py \
            --dir build/outputs/pod-staging \
            --key signing.key \
            --out build/outputs/${{ github.event.repository.name }}-${{ github.ref_name }}.zlpod
          rm -f signing.key

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/*.zlpod
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
